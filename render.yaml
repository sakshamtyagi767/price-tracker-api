services:
  - type: web
    name: price-tracker-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./price_tracker.db
      - key: PROJECT_NAME
        value: "Multi-Tenant Price Tracker API"
      - key: API_V1_STR
        value: "/api/v1"
